name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + typecheck (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('src/backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Ruff lint
        run: poetry run ruff check hexagents
      - name: Mypy strict
        run: poetry run mypy hexagents

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('src/backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Run unit tests
        run: poetry run pytest hexagents/tests hexagents/infrastructure/presenters/cli/tests -m 'not integration and not e2e' --tb=short

  coverage:
    name: Coverage (>= 95% on domain/application)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Cache Poetry env
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('src/backend/poetry.lock') }}
      - name: Install dependencies
        run: poetry install
      - name: Coverage report
        run: |
          poetry run pytest hexagents/tests hexagents/infrastructure/presenters/cli/tests --cov=hexagents --cov-report=xml --cov-report=term-missing --cov-fail-under=95
        env:
          COVERAGE_FAIL_UNDER: 95
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: src/backend/coverage.xml
          if-no-files-found: error

  react:
    name: React typecheck + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests + coverage
        run: npm run coverage
      - name: Upload React coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-coverage
          path: react/coverage/cobertura-coverage.xml
          if-no-files-found: warn

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests + coverage
        run: flutter test --coverage
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: warn

  codecov:
    name: Codecov upload
    runs-on: ubuntu-latest
    needs: [coverage, react, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: src/backend
      - uses: actions/download-artifact@v4
        with:
          name: react-coverage
          path: react/coverage
      - uses: actions/download-artifact@v4
        with:
          name: flutter-coverage
          path: flutter/coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: src/backend/coverage.xml,react/coverage/cobertura-coverage.xml,flutter/coverage/lcov.info
          flags: backend,frontend,mobile
          fail_ci_if_error: true
